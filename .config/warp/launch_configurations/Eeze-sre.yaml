# Warp launch configuration: the Eeze SRE workspace -- 16 tabs, 12 of them auto-resuming a
# named Claude Code session (home-manager/claude-launcher.nix): `ccw <name>` = work
# profile / eeze account for the eeze repos; the dotnix tab stays on `ccr` = personal.
#
# Managed by nix as an OUT-OF-STORE symlink (home-manager/default.nix, home.file):
#   ~/.warp/launch_configurations/Eeze-sre.yaml -> ~/dotnix/.config/warp/launch_configurations/Eeze-sre.yaml
# so Warp's own "edit launch config" UI keeps working -- edits land in this repo file.
#
# The `sleep`s stagger the Claude cold-starts 2s apart so twelve sessions do not all spawn
# at once. `cwd` must be absolute -- Warp does not expand `~`.
#
# `pane_mode: agent` opens the tab in Warp Agent Mode (Warp's own agent, model = whatever the
# agent dropdown last had, e.g. grok-4.6 via SuperGrok). No per-tab model/harness field exists.
---
name: Eeze-sre
active_window_index: 0
windows:
  - active_tab_index: 0
    tabs:
      - title: warroom-feedback-loop
        color: blue
        layout:
          cwd: /Users/dannyfroberg/eeze/slack-warroom-sync
          pane_mode: terminal
          commands:
            - exec: "ccw warroom-feedback-loop"
      - title: warroom-2
        color: blue
        layout:
          cwd: /Users/dannyfroberg/eeze/slack-warroom-sync
          pane_mode: terminal
          commands:
            - exec: "sleep 2; ccw warroom-2"
      - title: warroom-3
        color: blue
        layout:
          cwd: /Users/dannyfroberg/eeze/slack-warroom-sync
          pane_mode: terminal
          commands:
            - exec: "sleep 4; ccw warroom-3"
      - title: groundcover
        color: cyan
        layout:
          cwd: /Users/dannyfroberg/eeze/groundcover
          pane_mode: terminal
          commands:
            - exec: "sleep 6; ccw groundcover"
      - title: Alert Correlator
        color: cyan
        layout:
          cwd: /Users/dannyfroberg/eeze/groundcover-alert-correlator
